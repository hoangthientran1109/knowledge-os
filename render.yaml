services:
  - type: web
    name: knowledge-os
    runtime: node
    repo:  https://github.com/hoangthientran1109/knowledge-os
    plan: free
    region: singapore
    buildCommand: npm install && cd backend && npm install && npx prisma generate --schema=prisma/schema.prisma && npx prisma db push --schema=prisma/schema.prisma && cd ../frontend && npm install && npx vite build
    startCommand: cd backend && node server.js
    envVars:
      - key: AI_API_KEY
        sync: false
      - key: DATABASE_URL
        value: file:./dev.db
      - key: PORT
        value: "10000"
      - key: NODE_VERSION
        value: 18.0.0
